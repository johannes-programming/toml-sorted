[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=77.0",
]

[project]
authors = [
    { email = "johannes.programming@gmail.com", name = "Johannes" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "tomli-w<2,>=1.2",
]
description = "This project sorts TOML data."
keywords = []
license = "MIT"
license-files = [
    "LICENSE.txt",
]
name = "toml-sorted"
readme = "README.rst"
requires-python = ">=3.11"
version = "2.2.2.post1"

[project.urls]
Download = "https://pypi.org/project/toml-sorted/#files"
Index = "https://pypi.org/project/toml-sorted/"
Source = "https://github.com/johannes-programming/toml-sorted/"
Website = "https://toml-sorted.johannes-programming.online/"

[tool.mypy]
files = [
    ".",
]
python_version = "3.11"
strict = true
